name: PR title

# Pull request titles follow Conventional Commits, type(scope): summary, with
# a type from CONTRIBUTING.md. Its own workflow, so editing a title re-runs
# this check and not the build.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [redesign/product, master]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The title goes through env, never into the script itself.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|style|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^[:space:]]'
          if [[ "$TITLE" =~ $re ]]; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::The title should read type(scope): summary, for example fix(team): spell a name correctly. Types and scopes are in CONTRIBUTING.md."
          exit 1
